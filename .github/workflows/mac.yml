name: Build Desktop (macOS & Windows)

on:
  push:
    branches: [ main, dev*, TB* ]
    tags: [ 'v*' ]
  workflow_dispatch:
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - platform: macos
            arch: arm64
          - platform: windows
            arch: amd64
      fail-fast: false

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/load-build-versions

      - name: Set Release Tag and Suffix
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' husi.properties | cut -d'=' -f2 | tr -d '\r')
          echo "RELEASE_TAG=v${VERSION_NAME}-Desktop" >> $GITHUB_ENV
          
          REF_NAME="${{ github.ref_name }}"
          CLEAN_REF="${REF_NAME//\//-}"
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "FILE_SUFFIX=" >> $GITHUB_ENV
          else
            echo "FILE_SUFFIX=-${CLEAN_REF}" >> $GITHUB_ENV
          fi
          
          git config --global user.name "kafeixiang"
          git config --global user.email "kafeixiang@github.com"
          git tag "v$VERSION_NAME" || true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: burrunan/gradle-cache-action@v3

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: 'libcore/go.sum'

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install system packaging tools
        run: sudo apt-get update && sudo apt-get install -y nsis xorriso zstd libarchive-tools

      - name: Checkout JNI headers
        uses: actions/checkout@v7
        with:
          repository: Casterlabs/jni-headers
          ref: ${{ env.JNI_HEADERS_COMMIT }}
          path: jni-headers
          sparse-checkout: versions/${{ env.JNI_HEADERS_VERSION }}

      - name: Checkout macOS SDK
        if: matrix.platform == 'macos'
        uses: actions/checkout@v7
        with:
          repository: alexey-lysiuk/macos-sdk
          ref: ${{ env.MACOS_SDK_COMMIT }}
          path: macos-sdk
          sparse-checkout: MacOSX${{ env.MACOS_SDK_VERSION }}.sdk

      - name: Build Assets
        run: make assets

      - name: Build desktop libcore
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            make libcore_desktop DESKTOP_TARGETS=darwin/${{ matrix.arch }} JNI_INCLUDE="$JNI_INCLUDE" DARWIN_SDK="$MACOS_SDK_PATH"
          else
            make libcore_desktop DESKTOP_TARGETS=windows/${{ matrix.arch }} JNI_INCLUDE="$JNI_INCLUDE"
          fi

      - name: Package macOS
        if: matrix.platform == 'macos'
        run: |
          # 在 Linux 环境下，genisoimage 对 -modification-date 的支持有问题
          sed -i '/-modification-date/d' release/macos/package.sh
          make desktop_package_macos DESKTOP_TARGET=darwin/${{ matrix.arch }}
          if [[ -n "${{ env.FILE_SUFFIX }}" ]]; then
            find composeApp/build/compose/packages/macos -name "*.dmg" -exec bash -c 'mv "$1" "${1%.dmg}$FILE_SUFFIX.dmg"' _ {} \;
          fi

      - name: Package Windows
        if: matrix.platform == 'windows'
        run: |
          make desktop_package_windows DESKTOP_TARGET=windows/${{ matrix.arch }} WINDOWS_NO_SIGN=1
          if [[ -n "${{ env.FILE_SUFFIX }}" ]]; then
            find composeApp/build/compose/packages/windows -name "*.zip" -exec bash -c 'mv "$1" "${1%.zip}$FILE_SUFFIX.zip"' _ {} \;
            find composeApp/build/compose/packages/windows -name "*-installer.exe" -exec bash -c 'mv "$1" "${1%-installer.exe}$FILE_SUFFIX-installer.exe"' _ {} \;
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: husi-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            composeApp/build/compose/packages/macos/*.dmg
            composeApp/build/compose/packages/windows/*
          retention-days: 30

      - name: Create and Upload Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            FILES=(composeApp/build/compose/packages/macos/*.dmg)
            NOTES=$'# :memo: Release Notes (macOS)\n\n* Build for ${{ matrix.arch }}.\n\n> **注意 / Note:**\n> 如果应用提示损坏或闪退，请在终端执行：\n> `sudo xattr -cr /Applications/Husi.app` \n> `codesign --force --deep -s - /Applications/Husi.app`'
          else
            FILES=(composeApp/build/compose/packages/windows/*.exe composeApp/build/compose/packages/windows/*.zip)
            NOTES=$'# :memo: Release Notes (Windows)\n\n* Build for ${{ matrix.arch }}.'
          fi
          
          gh release create "${{ env.RELEASE_TAG }}" --title "${{ env.RELEASE_TAG }}" --prerelease --notes "$NOTES" 2>/dev/null || true
          gh release edit "${{ env.RELEASE_TAG }}" --notes "$NOTES"
          gh release upload "${{ env.RELEASE_TAG }}" "${FILES[@]}" --clobber
