name: Nightly Build
on:
  push:
    branches:
      - dev*
      - TB*
    paths:
      - "androidApp/**"
      - "composeApp/**"
      - "buildScript/**"
      - "release/linux/**"
      - "launcher/**"
      - "buildScr/**"
      - "libcore/**"
      - "grade/**"
      - ".github/workflows/nightly.yml"

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/load-build-versions
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            composeApp/libs
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Verify LibCore cache
        id: verify_libcore
        run: |
          missing=0
          required_files=(
            "composeApp/libs/libcore.aar"
            "composeApp/libs/libcore-desktop-linux-amd64.jar"
            "composeApp/libs/libcore-desktop-linux-arm64.jar"
            "composeApp/libs/libcore-desktop-windows-amd64.jar"
            "composeApp/libs/libcore-desktop-windows-arm64.jar"
            "composeApp/libs/libcore-desktop-darwin-amd64.jar"
            "composeApp/libs/libcore-desktop-darwin-arm64.jar"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required libcore artifact: $file"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
      - name: Install Golang
        if: steps.verify_libcore.outputs.ready != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: libcore/go.sum
      - uses: actions/setup-java@v5
        if: steps.verify_libcore.outputs.ready != 'true'
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
      - name: Setup Android NDK
        if: steps.verify_libcore.outputs.ready != 'true'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          add-to-path: true
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          local-cache: false
      - uses: mlugg/setup-zig@v2
        if: steps.verify_libcore.outputs.ready != 'true'
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: launcher-desktop-all-targets
      - name: Checkout JNI headers
        if: steps.verify_libcore.outputs.ready != 'true'
        uses: actions/checkout@v7
        with:
          repository: Casterlabs/jni-headers
          ref: ${{ env.JNI_HEADERS_COMMIT }}
          path: jni-headers
          sparse-checkout: versions/${{ env.JNI_HEADERS_VERSION }}
      - name: Checkout macOS SDK
        if: steps.verify_libcore.outputs.ready != 'true'
        uses: actions/checkout@v7
        with:
          repository: alexey-lysiuk/macos-sdk
          ref: ${{ env.MACOS_SDK_COMMIT }}
          path: macos-sdk
          sparse-checkout: MacOSX${{ env.MACOS_SDK_VERSION }}.sdk
      - name: Checkout cronet-go
        if: steps.verify_libcore.outputs.ready != 'true'
        uses: actions/checkout@v7
        with:
          repository: sagernet/cronet-go
          ref: ${{ env.CRONET_GO_COMMIT }}
          path: cronet-go
          submodules: recursive
          fetch-depth: 1
      - name: Cache Chromium toolchain
        if: steps.verify_libcore.outputs.ready != 'true'
        uses: actions/cache@v6
        with:
          path: |
            cronet-go/naiveproxy/src/third_party/llvm-build/
            cronet-go/naiveproxy/src/gn/out/
            cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
            cronet-go/naiveproxy/src/out/sysroot-build/
          key: cronet-toolchain-linux-amd64-arm64-${{ env.CRONET_GO_COMMIT }}
      - name: Download Chromium toolchain
        if: steps.verify_libcore.outputs.ready != 'true'
        run: |
          set -xeuo pipefail
          rm -f "$GITHUB_WORKSPACE/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg"
          cd "$GITHUB_WORKSPACE/cronet-go"
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
          go run ./cmd/build-naive --target=linux/amd64 download-toolchain
          go run ./cmd/build-naive --target=linux/arm64 download-toolchain
      - name: Native Build
        if: steps.verify_libcore.outputs.ready != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export CRONET_GO_ROOT="$GITHUB_WORKSPACE/cronet-go"
          make libcore_android
          make libcore_desktop DESKTOP_TARGETS=linux/amd64,linux/arm64,windows/amd64,windows/arm64,darwin/amd64,darwin/arm64 JNI_INCLUDE="$JNI_INCLUDE" DARWIN_SDK="$MACOS_SDK_PATH"
      - name: Upload libcore
        uses: actions/upload-artifact@v7
        with:
          path: composeApp/libs/
          if-no-files-found: error
          name: "libcore"
  build:
    name: Build FOSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/load-build-versions
      - name: LibCore Artifact
        uses: actions/download-artifact@v8
        with:
          name: "libcore"
          path: composeApp/libs
      - name: Verify libcore artifacts
        run: |
          ls -la composeApp/libs || true
          test -f composeApp/libs/libcore.aar
          test -f composeApp/libs/libcore-desktop-linux-amd64.jar
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Golang
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: libcore/go.sum
      - name: Cache route assets
        id: cache-assets
        uses: actions/cache@v6
        with:
          path: composeApp/src/commonMain/composeResources/files/sing-box
          key: assets-${{ env.GEOIP_VERSION }}-${{ env.GEOSITE_VERSION }}
      - name: Prepare assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: make assets
      - name: Generate about libraries metadata
        run: make aboutlibraries_go aboutlibraries_android
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "${{ secrets.LOCAL_PROPERTIES }}" >> local.properties
          ./gradlew :composeApp:exportLibraryDefinitions
          KEYSTORE_PASS="${{ secrets.KEYSTORE_PASS }}" ALIAS_NAME="${{ secrets.ALIAS_NAME }}" ALIAS_PASS="${{ secrets.ALIAS_PASS}}" ./gradlew clean androidApp:assembleFossDebug
          APK=$(find androidApp/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          rm $APK/output-metadata.json
          echo "APK=$APK" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v7
        with:
          name: APKs
          path: ${{ env.APK }}

  desktop:
    name: Build Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runs_on }}
    needs:
      - libcore
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            target: linux/amd64
            platform: linux
            runs_on: ubuntu-latest
          - name: linux-arm64
            target: linux/arm64
            platform: linux
            runs_on: ubuntu-24.04-arm
          - name: windows-amd64
            target: windows/amd64
            platform: windows
            runs_on: ubuntu-latest
          - name: windows-arm64
            target: windows/arm64
            platform: windows
            runs_on: ubuntu-latest
          - name: macos-amd64
            target: darwin/amd64
            platform: macos
            runs_on: ubuntu-latest
          - name: macos-arm64
            target: darwin/arm64
            platform: macos
            runs_on: ubuntu-latest
    #          - darwin/amd64
    #          - darwin/arm64
    #          - windows/amd64
    #          - windows/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/load-build-versions
      - name: LibCore Artifact
        uses: actions/download-artifact@v8
        with:
          name: "libcore"
          path: composeApp/libs
      - name: Verify libcore artifacts
        run: |
          target="${{ matrix.target }}"
          platform="${target%%/*}"
          arch="${target##*/}"
          # map darwin to macos if needed, but the jar filename uses platform from target
          required_jar="composeApp/libs/libcore-desktop-${platform}-${arch}.jar"
          ls -la composeApp/libs || true
          test -f composeApp/libs/libcore.aar
          test -f "$required_jar"
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Golang
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: libcore/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: launcher-desktop-${{ matrix.name }}
      - name: Install system packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis xorriso
      - name: Cache nfpm
        if: matrix.platform == 'linux'
        id: cache-nfpm
        uses: actions/cache@v6
        with:
          path: ~/go/bin/nfpm
          key: nfpm-${{ runner.os }}-${{ runner.arch }}-${{ env.NFPM_VERSION }}
      - name: Install nfpm
        if: matrix.platform == 'linux' && steps.cache-nfpm.outputs.cache-hit != 'true'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v${NFPM_VERSION}
      - name: Cache route assets
        id: cache-assets
        uses: actions/cache@v6
        with:
          path: composeApp/src/commonMain/composeResources/files/sing-box
          key: assets-${{ env.GEOIP_VERSION }}-${{ env.GEOSITE_VERSION }}
      - name: Prepare assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: make assets
      - name: Generate about libraries metadata
        run: make aboutlibraries_go aboutlibraries_desktop DESKTOP_TARGET=${{ matrix.target }}
      - name: Desktop Package
        env:
          BUILD_PLUGIN: none
        run: |
          ./gradlew :composeApp:exportLibraryDefinitions
          # Ensure release tag exists locally for packaging scripts
          VERSION_NAME=$(grep '^VERSION_NAME=' husi.properties | cut -d'=' -f2 | tr -d '\r')
          git tag -f "v${VERSION_NAME}"
          make desktop_package_${{ matrix.platform }} DESKTOP_TARGET=${{ matrix.target }}
      - name: Normalize artifact target
        id: artifact_target
        run: |
          target="${{ matrix.target }}"
          echo "safe=${target//\//-}" >> "$GITHUB_OUTPUT"
      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "desktop-${{ steps.artifact_target.outputs.safe }}"
          if-no-files-found: error
          path: composeApp/build/compose/packages
  release:
    name: Publish Release
    if: github.event.inputs.release != 'y'
    runs-on: ubuntu-latest
    needs:
      - build
      - desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Download APK Artifacts
        uses: actions/download-artifact@v8
        with:
          name: APKs
          path: artifacts/
      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: desktop-assets/
          merge-multiple: true
      - name: Set Release Tag and Suffix
        run: |
          VERSION=$(grep '^VERSION_NAME=' husi.properties | cut -d'=' -f2 | tr -d '\r')
          echo "RELEASE_TAG=v${VERSION}-DEBUG" >> $GITHUB_ENV
          
          REF_NAME="${{ github.ref_name }}"
          CLEAN_REF="${REF_NAME//\//-}"
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "FILE_SUFFIX=" >> $GITHUB_ENV
          else
            echo "FILE_SUFFIX=-${CLEAN_REF}" >> $GITHUB_ENV
          fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          
          # Process APKs
          if [ -d artifacts ]; then
            find artifacts -name "*.apk" | while read -r file; do
              filename=$(basename "$file")
              if [[ -n "${{ env.FILE_SUFFIX }}" ]]; then
                new_name="${filename%.apk}${{ env.FILE_SUFFIX }}.apk"
              else
                new_name="$filename"
              fi
              cp "$file" "release-assets/$new_name"
            done
          fi
          
          # Process Desktop Assets
          if [ -d desktop-assets ]; then
            find desktop-assets -type f \( -name "*.jar" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pacman" -o -name "*.dmg" -o -name "*.exe" -o -name "*.zip" \) | while read -r file; do
              filename=$(basename "$file")
              if [[ -n "${{ env.FILE_SUFFIX }}" ]]; then
                ext="${filename##*.}"
                base="${filename%.*}"
                new_name="${base}${{ env.FILE_SUFFIX }}.${ext}"
              else
                new_name="$filename"
              fi
              cp "$file" "release-assets/$new_name"
            done
          fi

          gh release create "${{ env.RELEASE_TAG }}" --title "${{ env.RELEASE_TAG }}" --prerelease \
            --notes $'# :memo: Debug Build Notes\n\n* Fixes and improvements.' 2>/dev/null || true
          
          gh release upload "${{ env.RELEASE_TAG }}" ./release-assets/* --clobber
